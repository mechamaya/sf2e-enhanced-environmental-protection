name: Release Creation

on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # get part of the tag after the `v`
      - name: Extract tag version number
        id: get-version
        run: echo "version-without-v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Substitute the Manifest and Download URLs in the `module.json`.
      - name: Substitute Manifest and Download Links For Versioned Ones
        id: manifest
        env:
          VERSION: ${{ steps.get-version.outputs.version-without-v }}
          MANIFEST: https://github.com/${{ github.repository }}/releases/latest/download/module.json
          DOWNLOAD: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip
        run: |
          jq '.version = env.VERSION | .manifest = env.MANIFEST | .download = env.DOWNLOAD' module.json > module.tmp.json
          mv module.tmp.json module.json
          echo "compatibility=$(jq -c .compatibility module.json)" >> "$GITHUB_OUTPUT"

      - name: Create Zip
        run: zip -r9 ./module.zip module.json README.md LICENSE dist lang packs artwork styles

      - name: Update Release with Files
        uses: ncipollo/release-action@v1.16.0
        with:
          allowUpdates: true # Set this to false if you want to prevent updating existing releases
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          name: ${{ steps.get-version.outputs.version-without-v }}
          artifacts: './module.json, ./module.zip'

      # Publish to FoundryVTT
      - name: Publish FoundryVTT Package
        if: ${{ !github.event.release.prerelease && env.PACKAGE_TOKEN != '' }}
        uses: JamesIves/fetch-api-data-action@v2
        with:
          endpoint: https://api.foundryvtt.com/_api/packages/release_version/
          configuration: '{ "method": "POST", "headers": { "Content-Type": "application/json", "Authorization": "${{ secrets.PACKAGE_TOKEN }}" }, "body": { "id": "sf2e-enhanced-environmental-protection", "dry-run": false, "release": { "version": "${{ steps.get-version.outputs.version-without-v }}", "manifest": "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.json", "notes": "https://github.com/${{ github.repository }}/releases/tag/${{ github.event.release.tag_name }}", "compatibility": ${{ steps.manifest.outputs.compatibility }} } } }'
